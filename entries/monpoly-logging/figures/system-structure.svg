<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" role="img" aria-label="Project structure: the user sends events, signature and policy to the wrapper, which talks to MonPoly and QuestDB" class="diagram" xmlns:c2pa="http://c2pa.org/manifest">
<defs><marker id="ah-ws" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
<g fill="none" stroke="currentColor" stroke-width="1.2">
<rect x="10" y="44" width="96" height="46" rx="12"/>
<rect x="200" y="10" width="210" height="120"/><path d="M200 36H410"/>
<rect x="30" y="250" width="240" height="120"/><path d="M30 276H270"/>
<rect x="340" y="250" width="240" height="120"/><path d="M340 276H580"/>
<path d="M106 67H196" marker-end="url(#ah-ws)" stroke="var(--fig-blue)"/>
<path d="M226 130V246" marker-end="url(#ah-ws)" stroke="var(--fig-blue)"/>
<path d="M256 250V134" marker-end="url(#ah-ws)" stroke="var(--fig-purple)"/>
<path d="M392 130V246" marker-end="url(#ah-ws)" stroke="var(--fig-blue)"/>
<path d="M560 250V70H414" marker-end="url(#ah-ws)" stroke="var(--fig-purple)"/>
</g>
<g fill="currentColor" stroke="none" font-size="13" text-anchor="middle">
<text x="58" y="72">User</text>
<text x="305" y="28" font-weight="600">Wrapper</text>
<text x="305" y="72">Check JSON formatting</text>
<text x="305" y="96">Convert JSON to MonPoly log</text>
<text x="150" y="268" font-weight="600">MonPoly</text>
<text x="150" y="310">Check monitorability of policies</text>
<text x="150" y="334">Compute relative intervals</text>
<text x="150" y="352" font-size="11.5" fill="var(--muted)">(for policy change)</text>
<text x="460" y="268" font-weight="600">QuestDB</text>
<text x="460" y="314">Keeps a copy of the trace</text>
<text x="460" y="334">already processed by MonPoly</text>
</g>
<g stroke="none" font-size="11">
<text x="151" y="34" text-anchor="middle" fill="var(--fig-blue)"><tspan x="151">events /</tspan><tspan x="151" dy="13">signature / policy</tspan></text>
<text x="218" y="176" text-anchor="end" fill="var(--fig-blue)"><tspan x="218">events /</tspan><tspan x="218" dy="13">signature /</tspan><tspan x="218" dy="13">policy</tspan></text>
<text x="263" y="170" fill="var(--fig-purple)"><tspan x="263">monitor verdict /</tspan><tspan x="263" dy="13">monitorability /</tspan><tspan x="263" dy="13">relative intervals</tspan></text>
<text x="400" y="176" fill="var(--fig-blue)"><tspan x="400">monitored</tspan><tspan x="400" dy="13">events</tspan></text>
<text x="552" y="226" text-anchor="end" fill="var(--fig-purple)">query response</text>
</g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
