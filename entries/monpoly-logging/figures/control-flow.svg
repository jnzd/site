<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="Control flow for an incoming event: the wrapper checks JSON keys, forwards the event to MonPoly, which checks order and signature compliance; valid events are reported and forwarded to QuestDB, invalid ones are reported as faulty" class="diagram" xmlns:c2pa="http://c2pa.org/manifest">
<defs><marker id="ah-fc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
<g fill="none" stroke="currentColor" stroke-width="1.2"><rect x="4" y="46" width="112" height="68" rx="0"/><path d="M134 80L206 24L278 80L206 136Z"/><rect x="302" y="46" width="112" height="68" rx="0"/><path d="M432 80L504 24L576 80L504 136Z"/><path d="M594 80L666 24L738 80L666 136Z"/><rect x="760" y="36" width="136" height="88" rx="0"/><rect x="140" y="192" width="132" height="52" rx="24"/><rect x="438" y="192" width="132" height="52" rx="24"/><rect x="600" y="192" width="132" height="52" rx="24"/><path d="M116 80H130" marker-end="url(#ah-fc)" stroke="currentColor"/><path d="M278 80H298" marker-end="url(#ah-fc)" stroke="var(--accent)"/><path d="M414 80H428" marker-end="url(#ah-fc)" stroke="currentColor"/><path d="M576 80H590" marker-end="url(#ah-fc)" stroke="var(--accent)"/><path d="M738 80H756" marker-end="url(#ah-fc)" stroke="var(--accent)"/><path d="M206 136V188" marker-end="url(#ah-fc)" stroke="var(--muted)"/><path d="M504 136V188" marker-end="url(#ah-fc)" stroke="var(--muted)"/><path d="M666 136V188" marker-end="url(#ah-fc)" stroke="var(--muted)"/></g>
<g stroke="none" font-size="12.5"><text text-anchor="middle" fill="currentColor"><tspan x="60.0" y="76.5">Wrapper parses</tspan><tspan x="60.0" y="92.5">JSON</tspan></text><text text-anchor="middle" fill="currentColor"><tspan x="206" y="76.5">Required keys</tspan><tspan x="206" y="92.5">present?</tspan></text><text text-anchor="middle" fill="currentColor"><tspan x="358.0" y="76.5">Send event to</tspan><tspan x="358.0" y="92.5">MonPoly</tspan></text><text text-anchor="middle" fill="currentColor"><tspan x="504" y="84.5">In order?</tspan></text><text text-anchor="middle" fill="currentColor"><tspan x="666" y="76.5">Signature</tspan><tspan x="666" y="92.5">compliant?</tspan></text><text text-anchor="middle" fill="currentColor"><tspan x="828.0" y="60.5">Report monitor</tspan><tspan x="828.0" y="76.5">verdict to user;</tspan><tspan x="828.0" y="92.5">forward event</tspan><tspan x="828.0" y="108.5">to QuestDB</tspan></text><text text-anchor="middle" fill="currentColor"><tspan x="206.0" y="214.5">Report faulty</tspan><tspan x="206.0" y="230.5">JSON formatting</tspan></text><text text-anchor="middle" fill="currentColor"><tspan x="504.0" y="214.5">Report out-of-order</tspan><tspan x="504.0" y="230.5">time stamp</tspan></text><text text-anchor="middle" fill="currentColor"><tspan x="666.0" y="214.5">Report faulty</tspan><tspan x="666.0" y="230.5">predicate</tspan></text></g>
