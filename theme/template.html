<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="article">
<link rel="stylesheet" href="{{{root}}}katex/katex.min.css">
<link rel="stylesheet" href="{{{root}}}style.css">
<link rel="icon" href="{{{root}}}favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{{root}}}apple-touch-icon.png">
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<script src="{{{root}}}theme.js" defer></script>
<script src="{{{root}}}site.js" defer></script>
{{{scripts}}}
</head>
<body class="{{bodyClass}}">

<div class="progress" aria-hidden="true"><span></span></div>
{{{siteHeader}}}

<header class="hero">
  <h1>{{title}}</h1>
  <p class="subtitle">{{subtitle}}</p>
  <p class="byline">{{{byline}}}</p>
  <p class="byline people">{{{people}}}</p>
  <p class="actions">{{{actions}}}</p>
  <!-- Optional hero visual: put a canvas, SVG or video here. -->
  <div class="hero-visual" id="hero-visual">{{{heroVisual}}}</div>
  <a class="scroll-hint" href="#content">Scroll</a>
</header>

<nav class="rail" aria-label="Sections">{{{rail}}}</nav>

<main>
  <article class="post" id="content">
{{{content}}}
  </article>
</main>

<footer class="site-footer">
  <span><a href="{{{root}}}">{{siteName}}</a></span>
  <span>{{institution}}</span>
  <span>{{date}}</span>
  <span class="privacy">Anonymous visit statistics via Cloudflare Web Analytics, no cookies</span>
</footer>

</body>
</html>
