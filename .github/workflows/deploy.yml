# Builds the site and publishes it to GitHub Pages on every push to main.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A deploy that has started always finishes. Pushes made meanwhile wait, and
# only the newest of them runs next (GitHub drops the older waiting ones).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # A private thesis repo needs a token that can read it (see README).
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pandoc and poppler
        run: sudo apt-get update && sudo apt-get install -y pandoc poppler-utils
      - run: npm ci
      # Rendered PDF pages, keyed by the PDF's hash: only changed PDFs are rendered again.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: render-${{ github.sha }}
          restore-keys: render-
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
