<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="article">
<link rel="stylesheet" href="katex/katex.min.css">
<link rel="stylesheet" href="style.css">
<script src="site.js" defer></script>
</head>
<body>

<div class="progress" aria-hidden="true"><span></span></div>

<header class="hero">
  <h1>{{title}}</h1>
  <p class="subtitle">{{subtitle}}</p>
  <p class="byline">{{{byline}}}</p>
  <p class="byline people">{{{people}}}</p>
  <p class="actions">{{{actions}}}</p>
  <!-- Optional hero visual: put a canvas, SVG or video here. -->
  <div class="hero-visual" id="hero-visual"></div>
  <a class="scroll-hint" href="#content">Scroll</a>
</header>

<nav class="rail" aria-label="Sections">{{{rail}}}</nav>

<main>
  <article class="post" id="content">
{{{content}}}
  </article>
</main>

<footer class="site-footer">
  <span>{{author}}</span>
  <span>{{institution}}</span>
  <span>{{date}}</span>
</footer>

</body>
</html>
